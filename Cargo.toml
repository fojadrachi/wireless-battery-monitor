[package]
name = "akku-monitor"
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Akku-Stand von Funk-Headsets und -Mäusen in der Windows-Taskleiste (Rust-Port von BatteryHub)"

[dependencies]
hidapi = "2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry",
    "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
    "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm", "Win32_Globalization", "Win32_System_SystemInformation",
] }
windows = { version = "0.61", features = [
    "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility",
] }

[build-dependencies]
winresource = "0.1.34"


[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
